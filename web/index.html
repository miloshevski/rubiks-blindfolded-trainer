<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold Trainer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #d5d9e0;
    --accent: #2f6fed; --cube-body: #15171a;
    --U: #ffffff; --D: #ffd500; --F: #1fa84f; --B: #1e5fd6; --R: #d6322b; --L: #ff8a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --panel: #1d2026; --text: #e8eaee; --muted: #9aa3b0; --line: #343a44; --accent: #6b9bff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=text] { flex: 1 1 320px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--text); font: 14px ui-monospace, monospace; }
  select, button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #msg { color: #d6322b; min-height: 1.4em; margin: 6px 0 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #net { width: 100%; max-width: 440px; display: block; margin: 0 auto; }
  .stage { height: 340px; display: flex; align-items: center; justify-content: center; perspective: 900px; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  /* 3D cube built from 26 cubies so single layers can turn. */
  #cube { --c: 70px; width: calc(var(--c) * 3); height: calc(var(--c) * 3); position: relative; transform-style: preserve-3d; }
  .layer { position: absolute; inset: 0; transform-style: preserve-3d; }
  .cubie { position: absolute; left: var(--c); top: var(--c); width: var(--c); height: var(--c); transform-style: preserve-3d; }
  .cubie > b { position: absolute; inset: 0; display: flex; background: var(--cube-body); border-radius: 4px; backface-visibility: hidden; }
  .cubie > b > i { flex: 1; margin: 3px; border-radius: 6px; }
  .cubie > .F { transform: translateZ(calc(var(--c) / 2)); }
  .cubie > .B { transform: rotateY(180deg) translateZ(calc(var(--c) / 2)); }
  .cubie > .R { transform: rotateY(90deg) translateZ(calc(var(--c) / 2)); }
  .cubie > .L { transform: rotateY(-90deg) translateZ(calc(var(--c) / 2)); }
  .cubie > .U { transform: rotateX(90deg) translateZ(calc(var(--c) / 2)); }
  .cubie > .D { transform: rotateX(-90deg) translateZ(calc(var(--c) / 2)); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
  .wide { grid-column: 1 / -1; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, monospace; }
  .memo { font: 15px ui-monospace, monospace; margin: 0 0 10px; }
  .ok { color: #1fa84f; } .bad { color: #d6322b; }
  .sim { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  #simstatus { font: 15px ui-monospace, monospace; color: var(--muted); }
  .pform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pform label { display: flex; gap: 6px; align-items: center; flex: 1 1 260px; }
  .pform label.chk { flex: 0 0 auto; }
  #p-result { font: 16px ui-monospace, monospace; margin: 10px 0 0; min-height: 1.4em; white-space: pre-line; }
  .hl { background: #ffe27a; color: #3a2c00; font-weight: 700; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>Blindfold Trainer — M2 + Old Pochmann</h1>
  <form id="form">
    <input type="text" id="scramble" placeholder="Enter a scramble, or leave empty for a random one" autocomplete="off" spellcheck="false">
    <select id="parity" title="Parity algorithm"><option value="1">Parity alg 1</option><option value="2">Parity alg 2</option></select>
    <button class="primary" type="submit">Apply</button>
    <button type="button" id="random">New random scramble</button>
  </form>
  <p id="msg"></p>
</header>
<main>
  <section><h2>2D net</h2><svg id="net" viewBox="0 0 12 9" role="img" aria-label="Unfolded cube"></svg></section>
  <section><h2>3D cube</h2>
    <div class="stage" id="stage"><div id="cube"></div></div>
    <p class="hint">Drag to rotate</p>
    <div class="sim"><button type="button" id="simulate" data-idle="Simulate solving">Simulate solving</button><span id="simstatus"></span></div></section>
  <section class="wide"><h2>Check your solution</h2>
    <form id="practice" class="pform" autocomplete="off">
      <label>Edges <input type="text" id="p-edges" placeholder="e.g. hs ef bo sa gn p" spellcheck="false"></label>
      <label>Corners <input type="text" id="p-corners" placeholder="e.g. bn cs wj dg" spellcheck="false"></label>
      <label class="chk" title="Uses the parity algorithm selected at the top"><input type="checkbox" id="p-parity"> Parity</label>
      <button class="primary" type="submit">Check</button>
      <button type="button" id="p-render" data-idle="Render my solution" disabled>Render my solution</button>
    </form>
    <p id="p-result"></p></section>
  <section class="wide"><h2>Solution <span id="verified"></span></h2>
    <p class="memo" id="memo"></p><pre id="solution"></pre></section>
</main>
<script>
const COLORS = { U: 'var(--U)', D: 'var(--D)', F: 'var(--F)', B: 'var(--B)', R: 'var(--R)', L: 'var(--L)' };
// 2D net layout: face -> [column, row] in units of 3 cells.
const NET = { U: [1, 0], L: [0, 1], F: [1, 1], R: [2, 1], B: [3, 1], D: [1, 2] };
const $ = id => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';

function drawNet(f) {
  const net = $('net'); net.replaceChildren();
  for (const [face, [cx, cy]] of Object.entries(NET)) {
    for (let i = 0; i < 9; i++) {
      const r = document.createElementNS(SVG, 'rect');
      r.setAttribute('x', cx * 3 + (i % 3) + 0.04); r.setAttribute('y', cy * 3 + Math.floor(i / 3) + 0.04);
      r.setAttribute('width', 0.92); r.setAttribute('height', 0.92); r.setAttribute('rx', 0.12);
      r.setAttribute('fill', COLORS[f[face][i]]); r.setAttribute('stroke', '#15171a'); r.setAttribute('stroke-width', 0.04);
      net.appendChild(r);
    }
    const t = document.createElementNS(SVG, 'text');
    t.setAttribute('x', cx * 3 + 0.12); t.setAttribute('y', cy * 3 + 0.42);
    t.setAttribute('font-size', 0.4); t.setAttribute('fill', '#15171a'); t.setAttribute('opacity', 0.45);
    t.textContent = face; net.appendChild(t);
  }
}

// --- 3D cube: 26 cubies at (x, y, z) in {-1,0,1}; y is up, z is towards the front ---
const CUBIE_PX = 70;
const FACE_AXIS = { U: ['y', 1], D: ['y', -1], R: ['x', 1], L: ['x', -1], F: ['z', 1], B: ['z', -1] };
// Sticker index (row * 3 + col) inside a face string, same layout as bld/render.py.
const CELL = {
  U: (x, y, z) => (1 + z) * 3 + (1 + x), D: (x, y, z) => (1 - z) * 3 + (1 + x),
  F: (x, y, z) => (1 - y) * 3 + (1 + x), B: (x, y, z) => (1 - y) * 3 + (1 - x),
  R: (x, y, z) => (1 - y) * 3 + (1 - z), L: (x, y, z) => (1 - y) * 3 + (1 + z),
};
const cubies = [];
(() => {
  for (const x of [-1, 0, 1]) for (const y of [-1, 0, 1]) for (const z of [-1, 0, 1]) {
    if (!x && !y && !z) continue;
    const el = document.createElement('div'); el.className = 'cubie';
    el.style.transform = `translate3d(${x * CUBIE_PX}px, ${-y * CUBIE_PX}px, ${z * CUBIE_PX}px)`;
    const stickers = {};
    for (const face of 'UDFBRL') {
      const side = document.createElement('b'); side.className = face;
      const [axis, dir] = FACE_AXIS[face];
      if ({ x, y, z }[axis] === dir) { stickers[face] = document.createElement('i'); side.appendChild(stickers[face]); }
      el.appendChild(side);
    }
    $('cube').appendChild(el);
    cubies.push({ el, x, y, z, stickers });
  }
})();

function draw3d(f) {
  for (const c of cubies)
    for (const [face, sticker] of Object.entries(c.stickers))
      sticker.style.background = COLORS[f[face][CELL[face](c.x, c.y, c.z)]];
}

// Layer turns.  CSS axes: X right, Y down, Z towards the viewer.
const TURNS = {
  U: ['Y', -90, c => c.y === 1], D: ['Y', 90, c => c.y === -1],
  R: ['X', 90, c => c.x === 1], L: ['X', -90, c => c.x === -1], M: ['X', -90, c => c.x === 0],
  F: ['Z', 90, c => c.z === 1], B: ['Z', -90, c => c.z === -1],
};
function animateMove(move, ms) {
  const [axis, quarter, inLayer] = TURNS[move[0]];
  const angle = quarter * (move.endsWith('2') ? 2 : move.endsWith("'") ? -1 : 1);
  const layer = document.createElement('div'); layer.className = 'layer';
  $('cube').appendChild(layer);
  const moving = cubies.filter(inLayer);
  for (const c of moving) layer.appendChild(c.el);
  return new Promise(resolve => {
    const start = performance.now();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      for (const c of moving) $('cube').appendChild(c.el);
      layer.remove();
      resolve();
    };
    const frame = now => {
      if (done) return;
      const t = Math.min(1, (now - start) / ms);
      const eased = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      layer.style.transform = `rotate${axis}(${angle * eased}deg)`;
      if (t < 1) requestAnimationFrame(frame); else finish();
    };
    requestAnimationFrame(frame);
    setTimeout(finish, ms + 40);   // keeps playback going when the tab is hidden (no animation frames)
  });
}

let rotX = -25, rotY = -35;
const applyRotation = () => { $('cube').style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`; };
(() => {
  const stage = $('stage'); let drag = null;
  stage.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    rotY += (e.clientX - drag[0]) * 0.6; rotX -= (e.clientY - drag[1]) * 0.6;
    drag = [e.clientX, e.clientY]; applyRotation();
  });
  const end = () => { drag = null; };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
})();

// Display-only highlighting of the swapping algorithms; the solution text itself is unchanged.
const HIGHLIGHT = { 'Edges:': /(?<!\S)M2(?!\S)/g, 'Corners:': /R U' R' U' R U R' F' R U R' U' R' F R/g };
function renderSolution(text) {
  const root = $('solution'); root.replaceChildren();
  let re = null;
  text.split('\n').forEach((line, i) => {
    if (i) root.append('\n');
    if (line in HIGHLIGHT || line === 'Parity:') { re = HIGHLIGHT[line] || null; root.append(line); return; }
    let last = 0;
    if (re) for (const m of line.split('   #')[0].matchAll(re)) {
      root.append(line.slice(last, m.index));
      const h = document.createElement('span'); h.className = 'hl'; h.textContent = m[0]; root.appendChild(h);
      last = m.index + m[0].length;
    }
    root.append(line.slice(last));
  });
}

// Replay the cube state after every move on the 3D cube.
const MOVE_MS = 200;   // 5 turns per second
const TURN_MS = 100;    // part of each move spent animating the layer turn
const sleep = ms => new Promise(r => setTimeout(r, ms));
let current = null, practice = null, simButton = null, playToken = 0;
function stopSim(status) {
  playToken++;
  if (simButton) simButton.textContent = simButton.dataset.idle;
  simButton = null;
  if (status !== undefined) $('simstatus').textContent = status;
}
async function play(frames, button, doneText) {
  const pressedStop = simButton === button;
  if (simButton) stopSim('Stopped');
  if (pressedStop || !current) return;
  if (!frames) { $('simstatus').textContent = 'Server is outdated: restart python3 -m bld.server'; return; }
  draw3d(current.facelets);
  if (!frames.length) { $('simstatus').textContent = 'No moves to play'; return; }
  const token = ++playToken;
  simButton = button; button.textContent = 'Stop';
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    $('simstatus').textContent = `${f.label}: ${f.move}  (${i + 1}/${frames.length})`;
    await animateMove(f.move, TURN_MS);
    draw3d(f.facelets);                       // snap to the exact state after this move
    if (token !== playToken) return;
    await sleep(MOVE_MS - TURN_MS);
    if (token !== playToken) return;
  }
  stopSim(doneText(frames.length));
}
$('simulate').addEventListener('click', () =>
  current && play(current.frames, $('simulate'), n => `Done: ${n} moves, cube solved`));

// Check a solution typed by the user (letters exactly as executed).
function resetPractice() {
  practice = null; $('p-render').disabled = true;
  $('p-result').textContent = ''; $('p-result').className = '';
}
$('practice').addEventListener('submit', async e => {
  e.preventDefault();
  if (!current) return;
  if (simButton === $('p-render')) stopSim('');
  const q = new URLSearchParams({
    scramble: current.scramble, edges: $('p-edges').value, corners: $('p-corners').value,
    parity: $('p-parity').checked ? '1' : '0', parity_alg: $('parity').value,
  });
  const res = await fetch('/api/check?' + q);
  const data = await res.json();
  resetPractice();
  const out = $('p-result');
  if (!res.ok) { out.className = 'bad'; out.textContent = data.error; return; }
  practice = data; $('p-render').disabled = false;
  out.className = data.correct ? 'ok' : 'bad';
  out.textContent = data.correct
    ? '✓ Correct: the cube is solved'
    : [`✗ Incorrect: edges ${data.edges_correct ? 'correct' : 'WRONG'}, corners ${data.corners_correct ? 'correct' : 'WRONG'}` +
         (data.centers_correct === false ? ', centers WRONG' : ''),
       data.wrong_edges.length ? `Wrong edges: ${data.wrong_edges.join(' ')}` : '',
       data.wrong_corners.length ? `Wrong corners: ${data.wrong_corners.join(' ')}` : '',
       data.note].filter(Boolean).join('\n');
});
$('p-render').addEventListener('click', () => practice && play(practice.frames, $('p-render'),
  n => `Your solution: ${n} moves, ${practice.correct ? 'cube solved' : 'cube NOT solved'}`));

async function load(scramble) {
  stopSim('');
  resetPractice();
  const q = new URLSearchParams({ parity: $('parity').value });
  if (scramble) q.set('scramble', scramble);
  $('msg').textContent = '';
  const res = await fetch('/api/cube?' + q);
  const data = await res.json();
  if (!res.ok) { $('msg').textContent = data.error; return; }
  current = data;
  $('scramble').value = data.scramble;
  drawNet(data.facelets); draw3d(data.facelets); applyRotation();
  $('memo').textContent = `Edges: ${data.edge_memo || '-'}   Corners: ${data.corner_memo || '-'}`;
  renderSolution(data.solution);
  const v = $('verified'); v.textContent = data.verified ? '✓ verified solved' : '✗ does not solve';
  v.className = data.verified ? 'ok' : 'bad';
}

$('form').addEventListener('submit', e => { e.preventDefault(); load($('scramble').value.trim()); });
$('random').addEventListener('click', () => { $('scramble').value = ''; load(''); });
load('');
</script>
</body>
</html>
