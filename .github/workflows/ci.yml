name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # `npm run build` type-checks (tsc -b) and then bundles, so a type error fails the run.
      - name: Build the web app
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Python tests
        run: python -m unittest discover -s tests -q
